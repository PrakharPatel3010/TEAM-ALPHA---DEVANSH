<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Briefing Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F6F2;
    --ink:#1F2A24;
    --ink-soft:#4B584F;
    --verified:#2F6F5E;
    --verified-bg:#E3EDE8;
    --flagged:#C98A2C;
    --flagged-bg:#F5EBDA;
    --accent:#C1522E;
    --hairline:#DAD9CC;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.6}
  .mono{font-family:'IBM Plex Mono',monospace}

  header.masthead{border-bottom:1px solid var(--hairline);padding:28px 40px;display:flex;justify-content:space-between;align-items:baseline}
  header.masthead h1{font-family:'Fraunces',serif;font-weight:600;font-size:28px;margin:0;letter-spacing:-0.01em}
  header.masthead .tag{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.08em}

  .hero{max-width:900px;margin:48px auto;padding:0 40px}
  .dropzone{border:1.5px dashed var(--hairline);border-radius:4px;padding:48px;text-align:center;background:var(--card);cursor:pointer;transition:border-color .15s}
  .dropzone:hover, .dropzone.dragover{border-color:var(--accent)}
  .dropzone p{margin:6px 0;color:var(--ink-soft);font-size:14px}
  .dropzone .big{font-family:'Fraunces',serif;font-size:20px;color:var(--ink);margin:0}
  #fileInput{display:none}
  .status{max-width:900px;margin:0 auto 24px;padding:0 40px;font-size:13px;color:var(--ink-soft)}
  .status.error{color:var(--accent)}

  .tabs{max-width:900px;margin:0 auto;padding:0 40px;display:flex;gap:4px;border-bottom:1px solid var(--hairline)}
  .tab-btn{font-family:'Inter',sans-serif;font-size:14px;font-weight:500;color:var(--ink-soft);background:none;border:none;padding:12px 16px;cursor:pointer;border-bottom:2px solid transparent}
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--accent)}
  .tab-panel{display:none}
  .tab-panel.active{display:block}

  .summary-wrap{max-width:900px;margin:0 auto;padding:32px 40px 60px;display:grid;grid-template-columns:1fr 140px;gap:24px}
  .summary-col section{margin-bottom:28px;position:relative}
  .summary-col h3{font-family:'Fraunces',serif;font-weight:600;font-size:16px;margin:0 0 8px;text-transform:capitalize}
  .summary-col p{margin:0;font-size:15px;color:var(--ink)}
  .margin-rail{position:relative;border-left:1px solid var(--hairline);padding-left:16px}
  .rail-marker{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:28px;height:1.6em}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .dot.verified{background:var(--verified)}
  .dot.flagged{background:var(--flagged)}
  .rail-marker .pg{color:var(--ink-soft)}

  .cards-grid{max-width:900px;margin:0 auto;padding:32px 40px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .flashcard{background:var(--card);border:1px solid var(--hairline);border-radius:4px;padding:18px;cursor:pointer;min-height:120px;transition:box-shadow .15s}
  .flashcard:hover{box-shadow:0 2px 8px rgba(31,42,36,0.08)}
  .flashcard .q{font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin:0 0 8px}
  .flashcard .a{font-size:13px;color:var(--ink-soft);display:none}
  .flashcard.flipped .a{display:block}
  .flashcard.flipped .q{color:var(--ink-soft);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .flashcard .pg{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--verified);margin-top:10px;display:inline-block}

  .map-wrap{max-width:900px;margin:0 auto;padding:32px 40px 60px}
  svg#conceptSvg{width:100%;height:420px;background:var(--card);border:1px solid var(--hairline);border-radius:4px}
  .node-label{font-family:'Inter',sans-serif;font-size:11px;fill:var(--ink)}
  .node-circle{fill:var(--verified-bg);stroke:var(--verified);stroke-width:1.5px}

  .slides-wrap{max-width:900px;margin:0 auto;padding:32px 40px 60px;display:flex;flex-direction:column;gap:14px}
  .slide{background:var(--card);border:1px solid var(--hairline);border-radius:4px;padding:20px 24px}
  .slide h4{font-family:'Fraunces',serif;font-size:17px;margin:0 0 10px}
  .slide ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink)}
  .slide .pg{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:10px;display:block}

  .empty{max-width:900px;margin:0 auto;padding:60px 40px;color:var(--ink-soft);font-size:14px}
</style>
</head>
<body>

<header class="masthead">
  <h1>Briefing Desk</h1>
  <span class="tag">verified paper summaries</span>
</header>

<div class="hero">
  <div class="dropzone" id="dropzone">
    <p class="big">Drop a research paper here</p>
    <p>or click to choose a PDF · we'll extract, verify, and brief it</p>
    <input type="file" id="fileInput" accept="application/pdf">
  </div>
</div>
<div class="status" id="status"></div>

<div class="tabs" id="tabs" style="display:none">
  <button class="tab-btn active" data-tab="summary">Summary</button>
  <button class="tab-btn" data-tab="flashcards">Flashcards</button>
  <button class="tab-btn" data-tab="conceptmap">Concept map</button>
  <button class="tab-btn" data-tab="slides">Slides</button>
</div>

<div id="panels">
  <div class="tab-panel active" id="panel-summary"></div>
  <div class="tab-panel" id="panel-flashcards"></div>
  <div class="tab-panel" id="panel-conceptmap"></div>
  <div class="tab-panel" id="panel-slides"></div>
</div>

<script>
const API_URL = "http://localhost:8000/brief";

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const statusEl = document.getElementById('status');
const tabsEl = document.getElementById('tabs');

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files.length) handleFile(e.target.files[0]);
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

async function handleFile(file) {
  statusEl.textContent = 'Uploading and briefing "' + file.name + '"... this can take 20-60s.';
  statusEl.classList.remove('error');

  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch(API_URL, { method: 'POST', body: formData });
    if (!res.ok) throw new Error('Server responded with ' + res.status);
    const data = await res.json();
    renderAll(data);
    statusEl.textContent = 'Brief ready for "' + file.name + '".';
    tabsEl.style.display = 'flex';
  } catch (err) {
    statusEl.textContent = 'Could not reach the backend (' + err.message + '). Showing demo data instead.';
    statusEl.classList.add('error');
    renderAll(DEMO_DATA);
    tabsEl.style.display = 'flex';
  }
}

function renderAll(data) {
  renderSummary(data.summary, data.verified_source);
  renderFlashcards(data.flashcards);
  renderConceptMap(data.concept_map);
  renderSlides(data.slides);
}

function renderSummary(summary, verifiedSource) {
  const panel = document.getElementById('panel-summary');
  if (!summary) { panel.innerHTML = '<div class="empty">No summary available.</div>'; return; }

  const sections = ['overview', 'methods', 'results', 'limitations'];
  const firstItem = cat => (verifiedSource && verifiedSource[cat] && verifiedSource[cat][0]) || null;
  const sourceMap = { overview: firstItem('claims'), methods: firstItem('methods'), results: firstItem('results'), limitations: firstItem('limitations') };

  let colHtml = '<div class="summary-col">';
  let railHtml = '<div class="margin-rail">';
  sections.forEach(key => {
    if (!summary[key]) return;
    const src = sourceMap[key];
    colHtml += `<section><h3>${key}</h3><p>${summary[key]}</p></section>`;
    if (src) {
      const cls = src.verified ? 'verified' : 'flagged';
      railHtml += `<div class="rail-marker"><span class="dot ${cls}"></span><span class="pg mono">p.${src.page_number} · ${Math.round((src.confidence||0)*100)}%</span></div>`;
    } else {
      railHtml += `<div class="rail-marker"></div>`;
    }
  });
  colHtml += '</div>';
  railHtml += '</div>';
  panel.innerHTML = `<div class="summary-wrap">${colHtml}${railHtml}</div>`;
}

function renderFlashcards(flashcards) {
  const panel = document.getElementById('panel-flashcards');
  if (!flashcards || !flashcards.length) { panel.innerHTML = '<div class="empty">No flashcards available.</div>'; return; }
  let html = '<div class="cards-grid">';
  flashcards.forEach((c, i) => {
    html += `<div class="flashcard" onclick="this.classList.toggle('flipped')">
      <p class="q">${c.question}</p>
      <p class="a">${c.answer}</p>
      <span class="pg">p.${c.page_number}</span>
    </div>`;
  });
  html += '</div>';
  panel.innerHTML = html;
}

function renderConceptMap(map) {
  const panel = document.getElementById('panel-conceptmap');
  if (!map || !map.nodes || !map.nodes.length) { panel.innerHTML = '<div class="empty">No concept map available.</div>'; return; }

  const w = 680, h = 400, cx = w/2, cy = h/2, r = 150;
  const nodes = map.nodes;
  const positions = {};
  nodes.forEach((n, i) => {
    const angle = (2 * Math.PI * i) / nodes.length;
    positions[n.id] = { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
  });

  let edgesHtml = '';
  (map.edges || []).forEach(e => {
    const a = positions[e.source], b = positions[e.target];
    if (!a || !b) return;
    edgesHtml += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#DAD9CC" stroke-width="1"/>`;
  });

  let nodesHtml = '';
  nodes.forEach(n => {
    const p = positions[n.id];
    nodesHtml += `<circle class="node-circle" cx="${p.x}" cy="${p.y}" r="26"/>
      <text class="node-label" x="${p.x}" y="${p.y}" text-anchor="middle" dominant-baseline="central">${truncate(n.label, 14)}</text>`;
  });

  panel.innerHTML = `<div class="map-wrap"><svg id="conceptSvg" viewBox="0 0 ${w} ${h}">${edgesHtml}${nodesHtml}</svg></div>`;
}
function truncate(s, n) { return s.length > n ? s.slice(0, n-1) + '…' : s; }

function renderSlides(slides) {
  const panel = document.getElementById('panel-slides');
  if (!slides || !slides.length) { panel.innerHTML = '<div class="empty">No slides available.</div>'; return; }
  let html = '<div class="slides-wrap">';
  slides.forEach(s => {
    html += `<div class="slide">
      <h4>${s.title}</h4>
      <ul>${(s.bullets||[]).map(b => `<li>${b}</li>`).join('')}</ul>
      <span class="pg">source: p.${s.page_number}</span>
    </div>`;
  });
  html += '</div>';
  panel.innerHTML = html;
}

const DEMO_DATA = {
  summary: {
    overview: "This paper introduces a self-attention based architecture that replaces recurrence and convolution entirely for sequence modeling.",
    methods: "The authors use stacked encoder-decoder layers built purely from multi-head self-attention and feed-forward sublayers, trained on standard translation benchmarks.",
    results: "The model achieves state-of-the-art BLEU scores while training significantly faster than prior recurrent architectures.",
    limitations: "The approach was evaluated mainly on translation tasks, and generalization to other sequence domains was left to future work."
  },
  verified_source: {
    claims: [{page_number: 2, confidence: 0.94, verified: true}],
    methods: [{page_number: 3, confidence: 0.91, verified: true}],
    results: [{page_number: 7, confidence: 0.55, verified: false}],
    limitations: [{page_number: 9, confidence: 0.88, verified: true}]
  },
  flashcards: [
    {question: "What replaces recurrence in this architecture?", answer: "Multi-head self-attention.", page_number: 3},
    {question: "What metric shows the model's translation quality?", answer: "BLEU score.", page_number: 7},
    {question: "What is a stated limitation?", answer: "Mainly tested on translation, not other sequence domains.", page_number: 9}
  ],
  concept_map: {
    nodes: [
      {id:"n1", label:"Self-attention", type:"method"},
      {id:"n2", label:"Encoder-decoder", type:"method"},
      {id:"n3", label:"BLEU improvement", type:"result"},
      {id:"n4", label:"Faster training", type:"result"},
      {id:"n5", label:"Domain generality unclear", type:"limitation"}
    ],
    edges: [
      {source:"n1", target:"n2"}, {source:"n2", target:"n3"},
      {source:"n2", target:"n4"}, {source:"n3", target:"n5"}
    ]
  },
  slides: [
    {title:"The problem", bullets:["Recurrent models are slow to train","Long-range dependencies are hard to capture"], page_number:1},
    {title:"The approach", bullets:["Pure attention-based architecture","No recurrence or convolution"], page_number:3},
    {title:"Results", bullets:["State-of-the-art BLEU scores","Faster training than prior models"], page_number:7}
  ]
};
</script>
</body>
</html>
